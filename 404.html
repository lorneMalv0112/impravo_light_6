<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-fEoVagPxSYFNyYUfHliprvupBP91cFJieqDSOSfwtyE='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Страница не найдена — Имущество и право</title>
<style>
:root{--ink:#272c29;--muted:#686b65;--accent:#007f36;--accent-dark:#00632a;--paper:#f5f2ec;--line:#e1ddd4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
main{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 32px;text-align:center}
small{display:block;color:var(--accent-dark);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(2rem,7vw,2.75rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 26px;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500}
a:hover{background:var(--accent-dark)}
a:focus-visible{outline:2px solid var(--accent-dark);outline-offset:3px}
@media(max-width:400px){main{padding:30px 20px}a{width:100%}}
</style>
</head>
<body>
<main>
<small>Ошибка 404</small>
<h1>Страница не найдена</h1>
<p>Возможно, ссылка устарела. Вся информация — на главной странице.</p>
<a id="home" href="/">На главную</a>
</main>
<script>(function(){var a=document.getElementById('home');var seg=location.pathname.split('/')[1];a.href=/\.github\.io$/.test(location.hostname)&&seg?'/'+seg+'/':'/';})();</script>
</body>
</html>
